<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marvellist</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: min(900px, 90vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        color: var(--accent);
      }

      p {
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.7;
      }

      .button {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 20px;
        background: var(--accent);
        color: #082f49;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome to Marvellist</h1>
      <p>
        This is a simple HTML website created in your repository. You can edit this file
        to add your own content, sections, images, or links.
      </p>
      <a class="button" href="#">Learn More</a>
    </div>
  </body>
</html>
